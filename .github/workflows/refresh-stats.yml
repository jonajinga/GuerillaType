# Refresh the community-stats snapshot from Umami Cloud once a week and
# commit it, so /analytics/ and /community-stats/ stop going stale when
# nobody deploys with a key in the build environment (they showed the
# 2026-05-11 snapshot until late September for exactly that reason).
#
# Needs one repository secret: UMAMI_API_KEY (Umami Cloud, API keys).
# Without it the job fails on purpose, so the gap shows up in Actions
# instead of on the site. The push below is made with GITHUB_TOKEN;
# Cloudflare Pages builds main on any push, so a refreshed snapshot
# goes live on its own.
name: Refresh community stats

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The key must be there
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
        run: |
          if [ -z "$UMAMI_API_KEY" ]; then
            echo "::error::The repository secret UMAMI_API_KEY is not set. Add it under Settings, Secrets and variables, Actions. Until then the site keeps its last committed snapshot."
            exit 1
          fi

      - name: Fetch the snapshot
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
        run: node scripts/fetch-umami-stats.mjs

      - name: Check the snapshot is whole and fresh
        run: node scripts/check-community-stats.mjs --max-age-days 2

      # updatedAt changes on every fetch, so this commits every week on
      # purpose: the date on the pages is the point. The guard only
      # matters if a run ever produces a byte-identical file.
      - name: Commit the snapshot
        run: |
          if git diff --quiet -- src/_data/communityStats.json; then
            echo "Snapshot unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/communityStats.json
          git commit -m "data(stats): refresh the community snapshot ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
