<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GuerillaType">
  <!-- Gorilla face: rounded shape, deep red -->
  <path d="M 4 14
           C 4 8, 9 4, 16 4
           C 23 4, 28 8, 28 14
           L 28 22
           C 28 26, 24 28, 16 28
           C 8 28, 4 26, 4 22
           Z"
        fill="#8a2521"/>
  <!-- Brow ridge / temple shadow -->
  <path d="M 6 15 C 8 18, 12 19, 16 19 C 20 19, 24 18, 26 15 L 26 22 C 26 25, 22 26.5, 16 26.5 C 10 26.5, 6 25, 6 22 Z"
        fill="#6e1c19"/>
  <!-- Muzzle (lighter red highlight) -->
  <ellipse cx="16" cy="21.5" rx="6" ry="4" fill="#a8362e"/>
  <!-- Nostrils -->
  <ellipse cx="14" cy="21" rx=".8" ry=".5" fill="#3a0d0b"/>
  <ellipse cx="18" cy="21" rx=".8" ry=".5" fill="#3a0d0b"/>
  <!-- Mouth -->
  <path d="M 13.5 23.4 Q 16 24.6 18.5 23.4" stroke="#3a0d0b" stroke-width=".9" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="11.5" cy="15.5" r="1.5" fill="#1a0606"/>
  <circle cx="20.5" cy="15.5" r="1.5" fill="#1a0606"/>
  <circle cx="11.9" cy="15.1" r=".4" fill="#fff"/>
  <circle cx="20.9" cy="15.1" r=".4" fill="#fff"/>
  <!-- Bandana band across forehead (bright red) -->
  <path d="M 3 10
           C 6 7, 11 6, 16 6
           C 21 6, 26 7, 29 10
           L 29 13
           C 26 11, 21 10, 16 10
           C 11 10, 6 11, 3 13 Z"
        fill="#c1413c"/>
  <!-- Bandana knot on the left side -->
  <path d="M 2 9 L 5.5 8 L 4.5 11 L 1 12 Z" fill="#c1413c"/>
  <path d="M 1 11 L 3 10.5 L 2.5 13 L .5 13.5 Z" fill="#a8362e"/>
  <!-- Bandana stitching (lighter red highlight) -->
  <path d="M 4 11.5 C 8 9.5, 24 9.5, 28 11.5" stroke="#e58060" stroke-width=".5" fill="none" stroke-linecap="round" opacity=".7"/>
</svg>
